[project]
name = "metadata-ablation-repro"
version = "0.1.0"
description = "Reproducibility artifact for 'Does Metadata Completeness Predict Text-to-SQL Accuracy? A Six-Model Ablation on BIRD Mini-Dev'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "gdown>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    # gyzasql engine runtime (the experiment runner)
    "pydantic>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=2.7.0",
]

[tool.uv]
package = false

# Usage:
#   uv sync                     # create .venv + resolve deps (writes uv.lock)
#   uv run jupyter notebook     # run the analysis notebooks
#   uv run jupyter nbconvert --execute --to notebook notebooks/02-analysis-and-charts.ipynb
